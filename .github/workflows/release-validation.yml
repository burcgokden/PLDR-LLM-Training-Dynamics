name: Release validation

on:
  push:
    branches: [main, maintenance/revision-label-cleanup]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_lean:
        description: Run the separate Lean compilation and axiom checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cpu-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
      - name: Install declared CPU dependencies
        run: |
          python -m pip install torch==2.12.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-checks.txt
      - name: Check scientific dependencies
        run: |
          python -m pip check
          python -c "from torchtune.modules import RotaryPositionalEmbeddings"
      - name: Check Git LFS availability
        run: git lfs version
      - name: Download immutable publication and evidence inputs
        run: python scripts/download_release_inputs.py --destination "$RUNNER_TEMP/pldr-release-inputs"
      - name: Validate final source bytes and record execution
        run: python scripts/release_gate.py --require-clean --data-repo "$RUNNER_TEMP/pldr-release-inputs/data" --pdf "$RUNNER_TEMP/pldr-release-inputs/publication.pdf"
      - name: Retain execution record and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            validation/
          retention-days: 90
          if-no-files-found: warn

  lean:
    if: github.event_name == 'workflow_dispatch' && inputs.run_lean
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned Lean dependencies
        shell: bash
        run: |
          mkdir -p validation
          lake exe cache get 2>&1 | tee validation/lean-dependencies.log
      - name: Build pinned Lean project
        shell: bash
        run: lake build 2>&1 | tee validation/lean-build.log
      - name: Recompile owned proofs and audit axioms
        shell: bash
        run: python scripts/check_lean.py 2>&1 | tee validation/lean-check.log
      - name: Retain separate formal record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-${{ github.sha }}-${{ github.run_attempt }}
          path: validation/
          retention-days: 90
          if-no-files-found: warn
