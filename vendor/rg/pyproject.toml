[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "row-rgmap"
version = "0.1.0"
description = "Exact positive-affine RG tools for PLDR-LLM row-map energy"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
