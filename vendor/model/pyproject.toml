[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pldr-model-rg"
version = "0.2.0"
description = "Dataset-conditioned model-wide renormalization and response measurements for PLDR-LLMs"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "torch", "safetensors", "transformers", "sentencepiece", "pyarrow", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
